<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <defs>
    <linearGradient id="rush-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915eff" />
      <stop offset="50%" stop-color="#804dee" />
      <stop offset="100%" stop-color="#5825cb" />
    </linearGradient>
    <linearGradient id="rush-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf9fff" />
      <stop offset="100%" stop-color="#915eff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#915eff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Badge -->
  <polygon
    points="160,20 290,95 290,245 160,320 30,245 30,95"
    fill="url(#rush-grad)"
    filter="url(#glow)"
  />

  <!-- Inner Dark Facet -->
  <polygon
    points="160,38 274,104 274,236 160,302 46,236 46,104"
    fill="#0f0c1b"
    stroke="url(#rush-glow)"
    stroke-width="5"
  />

  <!-- Subtle Accent Polylines -->
  <path
    d="M160 38 L160 85 M274 104 L232 128 M274 236 L232 212 M160 302 L160 255 M46 236 L88 212 M46 104 L88 128"
    stroke="#915eff"
    stroke-width="2.5"
    opacity="0.4"
  />

  <!-- Stylized Geometric "R" -->
  <g transform="translate(160, 170)">
    <!-- Vertical Spine -->
    <path
      d="M-46 -72 L-18 -72 L-18 72 L-46 72 Z"
      fill="#ffffff"
    />
    <!-- R Upper Loop -->
    <path
      d="M-22 -72 L20 -72 C46 -72 62 -58 62 -34 C62 -10 46 4 20 4 L-22 4 Z M6 -46 L20 -46 C29 -46 36 -42 36 -34 C36 -26 29 -22 20 -22 L6 -22 Z"
      fill="url(#rush-glow)"
    />
    <!-- R Diagonal Leg -->
    <path
      d="M-2 -2 L26 -2 L58 72 L28 72 Z"
      fill="#ffffff"
    />
  </g>
</svg>